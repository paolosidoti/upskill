<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina HTML di esempio</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --accent: #2563eb;
      --danger: #dc2626;
      --overlay: rgb(0 0 0 / 0.45);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --accent: #60a5fa;
        --danger: #f87171;
        --overlay: rgb(0 0 0 / 0.65);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
    }

    .card {
      width: min(680px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgb(0 0 0 / 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.6rem, 2.8vw, 2.2rem);
    }

    p { line-height: 1.6; }

    .btn {
      display: inline-block;
      margin-top: 1rem;
      text-decoration: none;
      background: var(--accent);
      color: white;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      border: 0;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: var(--overlay);
      padding: 1rem;
    }

    .modal-overlay.open { display: grid; }

    .modal {
      width: min(420px, 100%);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      padding: 1.2rem;
      box-shadow: 0 12px 30px rgb(0 0 0 / 0.2);
    }

    .modal h2 {
      margin: 0 0 0.5rem;
      color: var(--danger);
      font-size: 1.2rem;
    }

    .modal-actions {
      margin-top: 1rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ciao! Questa è una pagina HTML</h1>
    <p>
      Questo esempio include una struttura base con HTML5, stili CSS integrati
      e un layout responsive semplice.
    </p>
    <button class="btn" id="startBtn" type="button">Inizia</button>
  </main>

  <div class="modal-overlay" id="errorModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <div class="modal">
      <h2 id="modalTitle">Errore</h2>
      <p id="modalDesc">Si è verificato un errore. Riprova più tardi.</p>
      <div class="modal-actions">
        <button class="btn" id="closeModalBtn" type="button">Chiudi</button>
      </div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const errorModal = document.getElementById('errorModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const openModal = () => errorModal.classList.add('open');
    const closeModal = () => errorModal.classList.remove('open');

    startBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);

    errorModal.addEventListener('click', (event) => {
      if (event.target === errorModal) closeModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
